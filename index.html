<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Word Tile Board</title>
<style>
:root{--bg:#fbfaf6;--fg:#111;--tile:#eeeee8;--line:#d6d6cc;--accent:#1a5d4a;--muted:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#f0efe8;--tile:#34342f;--line:#4a4a43;--accent:#5fc3a3;--muted:#a3a39a}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#f0efe8;--tile:#34342f;--line:#4a4a43;--accent:#5fc3a3;--muted:#a3a39a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Arial,Helvetica,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,label.btn{font:inherit;font-size:.9rem;padding:8px 12px;border:1px solid var(--line);background:var(--tile);color:var(--fg);border-radius:8px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#wrap{overflow-x:auto;border:1px dashed var(--line);border-radius:10px}
#board{position:relative;width:100%;min-height:200px}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:4px 6px;background:var(--tile);color:var(--fg);border-radius:8px;font-weight:700;font-size:clamp(.7rem,2.6vw,1rem);text-transform:uppercase;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;box-shadow:0 1px 0 var(--line);transition:left .25s,top .25s,width .25s,height .25s;overflow:hidden}
.tile.img{padding:0}
.tile img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.tile.drag{cursor:grabbing;transition:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#status{margin:10px 0;font-size:.9rem;color:var(--muted);min-height:1.3em}
textarea{width:100%;box-sizing:border-box;min-height:90px;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
details{margin-top:14px}
</style></head>
<body><main>
<h1>Moveable Tiles</h1>
<p class="sub">Upload a screenshot of tiles and each one becomes a movable picture. Drag tiles anywhere to group them.</p>
<div class="bar">
<label class="btn">Upload Image<input id="file" type="file" accept="image/*" hidden></label>
<button id="reset">Reset Layout</button>
</div>
<div id="wrap"><div id="board"></div></div>
<div id="status"></div>
<details><summary>Type or paste words instead</summary>
<p class="sub">One word or phrase per line.</p>
<textarea id="txt"></textarea>
<div class="bar" style="margin-top:8px"><button class="primary" id="make">Make tiles</button></div>
</details>
</main>
<script>
const $=s=>document.querySelector(s), board=$('#board'), statusEl=$('#status');
const SAMPLE=['Tuxedo','Waddle','Antarctica','Traffic light','Gothic','Candy corn','Sans','Payphone','Roman','Emperor','Wishing well','Typewriter','Piggy bank','Calico','Parking meter','Neapolitan'];
let cols=4, z=1, original=[], aspect=null;
const G=10, MINW=112, MAXBYTES=15e6, MAXPIX=16e6, MAXTILES=64, MAXLEN=60;
function dims(){const W=board.clientWidth,w=(W-G*(cols-1))/cols;return{w,h:aspect?w/aspect:Math.max(52,Math.min(84,w*.5))}}
function size(){const d=dims(),n=board.children.length;
 board.style.height=3*(Math.ceil(n/cols)*(d.h+G)-G)+'px';return d}
function place(t,i,d){t.style.width=d.w+'px';t.style.height=d.h+'px';t.style.left=(i%cols)*(d.w+G)+'px';t.style.top=Math.floor(i/cols)*(d.h+G)+'px'}
function layout(order){const d=size();(order||[...board.children]).forEach((t,i)=>place(t,i,d))}
function build(list,c,asp){board.innerHTML='';cols=c;aspect=asp||null;original=list.slice();
 list.forEach(it=>{const t=document.createElement('div');t.className='tile';
  if(it.src){t.classList.add('img');t.dataset.i=it.i;const im=new Image();im.src=it.src;im.draggable=false;t.appendChild(im)}
  else t.textContent=it;
  board.appendChild(t);drag(t)});layout()}
function drag(t){let ox,oy;
 t.addEventListener('pointerdown',e=>{t.setPointerCapture(e.pointerId);t.classList.add('drag');t.style.zIndex=++z;
  const r=t.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault()});
 t.addEventListener('pointermove',e=>{if(!t.classList.contains('drag'))return;
  const b=board.getBoundingClientRect();
  const x=Math.max(0,Math.min(b.width-t.offsetWidth,e.clientX-b.left-ox));
  const y=Math.max(0,Math.min(b.height-t.offsetHeight,e.clientY-b.top-oy));
  t.style.left=x+'px';t.style.top=y+'px'});
 const end=()=>t.classList.remove('drag');
 t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end)}
$('#reset').onclick=()=>build(original,cols,aspect);
$('#make').onclick=()=>{const l=$('#txt').value.split('\n').map(s=>s.trim().slice(0,MAXLEN)).filter(Boolean).slice(0,MAXTILES);
 if(!l.length)return;build(l,l.length%4==0?4:Math.min(4,l.length));statusEl.textContent=l.length+' tiles created.'};
window.addEventListener('resize',()=>{const d=size();[...board.children].forEach(t=>{t.style.width=d.w+'px';t.style.height=d.h+'px'})});

/* ---- Image → tile pictures (no OCR) ---- */
function findTiles(img){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 const px=ctx.getImageData(0,0,c.width,c.height).data,S=4,w=Math.ceil(c.width/S),h=Math.ceil(c.height/S);
 const bg=[px[0],px[1],px[2]],m=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=((y*S)*c.width+x*S)*4;
  if(Math.abs(px[i]-bg[0])+Math.abs(px[i+1]-bg[1])+Math.abs(px[i+2]-bg[2])>25)m[y*w+x]=1}
 const boxes=[],seen=new Uint8Array(w*h);
 for(let s=0;s<w*h;s++){if(!m[s]||seen[s])continue;
  let x0=w,y0=h,x1=0,y1=0,n=0;const st=[s];seen[s]=1;
  while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;n++;
   if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   for(const q of[p-1,p+1,p-w,p+w]){if(q<0||q>=w*h||seen[q]||!m[q])continue;
    if((q===p-1&&x===0)||(q===p+1&&x===w-1))continue;seen[q]=1;st.push(q)}}
  const bw=x1-x0+1,bh=y1-y0+1;
  if(bw>=15&&bh>=8&&n/(bw*bh)>.6)boxes.push({x:x0*S,y:y0*S,w:bw*S,h:bh*S})}
 return{c,boxes}}
function arrange(boxes){
 boxes.sort((a,b)=>a.y-b.y);const mh=boxes[boxes.length>>1].h,rows=[];
 boxes.forEach(b=>{const r=rows.find(r=>Math.abs(r[0].y-b.y)<mh/2);r?r.push(b):rows.push([b])});
 rows.forEach(r=>r.sort((a,b)=>a.x-b.x));
 return{list:rows.flat(),cols:Math.max(...rows.map(r=>r.length))}}
function loadImg(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>ok(im);im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('image could not be opened'))};im.src=u})}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 let img;
 try{
  if(f.size>MAXBYTES)throw new Error('file is larger than 15 MB');
  statusEl.textContent='Finding tiles…';
  img=await loadImg(f);
  if(img.naturalWidth*img.naturalHeight>MAXPIX)throw new Error('image is larger than 16 megapixels');
  const{c,boxes}=findTiles(img);
  URL.revokeObjectURL(img.src);
  if(!boxes.length)throw new Error('no tiles detected');
  if(boxes.length>MAXTILES)throw new Error('more than '+MAXTILES+' tiles found');
  const{list,cols:nc}=arrange(boxes),ins=2,items=[];
  list.forEach((b,i)=>{const sw=b.w-ins*2,sh=b.h-ins*2,k=Math.min(1,360/sw),t=document.createElement('canvas');
   t.width=Math.round(sw*k);t.height=Math.round(sh*k);
   t.getContext('2d').drawImage(c,b.x+ins,b.y+ins,sw,sh,0,0,t.width,t.height);
   items.push({src:t.toDataURL('image/png'),i})});
  const asp=list.map(b=>(b.w-ins*2)/(b.h-ins*2)).sort((a,b)=>a-b)[list.length>>1];
  build(items,nc,asp);
  statusEl.textContent=items.length+' tiles imported as pictures.';
 }catch(err){
  if(img)URL.revokeObjectURL(img.src);
  statusEl.textContent='Couldn’t import that image ('+err.message+'). Try a screenshot that shows only the tiles.'}
 e.target.value=''};

$('#txt').value=SAMPLE.join('\n');
build(SAMPLE,4);
statusEl.textContent='Loaded with the 16 words from your first screenshot. Upload a new image to replace them.';
</script></body></html>
